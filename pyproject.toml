[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "rb-wordpress-bulk-editor"
# Версия — из git-тега vX.Y.Z (uv-dynamic-versioning); строку `version =` не добавлять.
dynamic = ["version"]
description = "WordPress bulk editor: Excel and WordPress in sync."
requires-python = ">=3.14"  # rb-html-to-gutenberg требует >=3.14
dependencies = [
    "rb-credentials>=0.7.1,<1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.26.0",
    "typer>=0.27,<0.29",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "PyYAML>=6.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "rb-html-to-gutenberg>=0.4",
    "platformdirs>=4.2",
]

[project.scripts]
wp-bulk = "rb_wordpress_bulk_editor.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/worppress-bulk-editor"

[tool.rb.install]
homeserver = ["rbtools"]
mac = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Импортный пакет исторически называется `src`. hatchling кладёт в wheel все
# файлы пакета, включая бандленный SKILL.md (его читают `wp-bulk --ai` и агент,
# у которого есть только установленный пакет) и py.typed.
[tool.hatch.build.targets.sdist]
# What a release must not carry: the agent's own files, the forge configs and the dev tooling. The wheel is
# narrow already (`packages = ["src/<pkg>"]`); this is about the sdist, which is otherwise a copy of the repo.
exclude = [
  "/.agents",
  "/.claude",
  "/.claude-plugin",
  "/.gitea",
  "/.github",
  "/docs",
  "/scripts",
  "/uv.lock",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CODING_STANDARDS.md",
  "/CONTEXT.md",
  "/.copier-answers.yml",
  "^\\.gitignore$",
  "/.gitleaks.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rb_wordpress_bulk_editor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Покрытие — часть гейта (release.py запускает голый `pytest`): fail_under ниже.
addopts = "--cov --cov-report=term-missing:skip-covered"
# Снапшоты справки лежат в tests/snapshots/help/<команда>.txt (стандарт §7), а не
# в раскладке syrupy `__snapshots__/<файл теста>/` — syrupy предупреждает, что
# «не может связать» файл с тестом. Может — по имени.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# S — bandit-правила безопасности (обязательны протоколом cli-builder).
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — это и есть инструмент (S101), пароли — фиктивные (S105–S107).
"tests/*" = ["S101", "S105", "S106", "S107"]
# Скрипты гейта (из шаблона, дословно): subprocess с фиксированным argv (git, uv), без shell;
# длину строк шаблон не проверяет (E501 у него не выбран) — копия не правится.
"scripts/*" = ["S603", "S607", "E501"]

[tool.coverage.run]
source = ["src/rb_wordpress_bulk_editor"]
# Ядро по умолчанию в Python 3.14 растёт по памяти на каждый вызов CLI (в CI процесс убивался).
core = "ctrace"
omit = ["src/__main__.py", "src/cli/__main__.py"]

[tool.coverage.report]
# Нижняя граница по факту текущего прогона, а не по пожеланиям:
# ронять сборку она не должна, но и опускаться ниже нельзя.
fail_under = 64

# ty (гейт release.py): src/ — на полной строгости. Легаси-тесты подсовывают
# утиные дублёры (FakeReader вместо ExcelReader, Series вместо Mapping) и
# проверяют Optional-результаты без сужения — эти правила в tests/ только
# предупреждают. Новые тесты пишутся так, чтобы предупреждений не добавлять.
[tool.ty.terminal]
# Предупреждения (только правила tests/ ниже) не валят гейт; ошибки — валят.
error-on-warning = false

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
unresolved-attribute = "warn"
unsupported-operator = "warn"
not-iterable = "warn"
invalid-assignment = "warn"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.uv]
# soupsieve 2.10 (still locked for python 3.11.0-3.11.4) carries 4 advisories.
override-dependencies = ["soupsieve>=4.1.2"]  # 2.10, still locked for 3.11.0-3.11.4, carries 4 advisories
# Пересобирать editable-установку при новом коммите/теге, чтобы --version шёл за тегом.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Наши пакеты — только из реестра Gitea: диапазон версий в dependencies, не git-тег.
[dependency-groups]
dev = [
    "click>=8",  # tests import click directly; typer no longer installs it
    "jsonschema>=4.23",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "syrupy>=4.8",
    "ty>=0.0.80",
]

[tool.cli-generator]
# Где scripts/check_command_docstrings.py (git pre-commit + хуки Claude Code)
# ищет команды: здесь они в src/cli/*_commands.py, а не в commands/*.py шаблона.
commands = ["src/cli/*_commands.py"]

# Siblings resolve from disk: a version range in `dependencies` plus a `path` source, never an index.
[tool.uv.sources]
rb-credentials = { path = "../rb-credentials", editable = true }
rb-html-to-gutenberg = { path = "../rb-html-to-gutenberg", editable = true }

