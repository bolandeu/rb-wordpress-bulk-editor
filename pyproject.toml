[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-bulk-editor"
version = "1.6.0"
description = "WordPress Bulk Editor - Excel <-> WordPress sync"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "python-slugify>=8.0.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "llmkit",
    "html_to_gutenberg",
]

[project.scripts]
wp-bulk = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

# Бандленный SKILL.md должен уехать в wheel: его читают `wp-bulk --ai`
# и агент, у которого есть только установленный пакет.
[tool.setuptools.package-data]
"src" = ["py.typed"]
"src.data" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S — bandit-правила безопасности (обязательны протоколом cli-builder).
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — это и есть инструмент (S101).
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__main__.py", "src/cli/__main__.py"]

[tool.coverage.report]
# Нижняя граница по факту текущего прогона, а не по пожеланиям:
# ронять сборку она не должна, но и опускаться ниже нельзя.
fail_under = 40

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.uv.sources]
llmkit = { git = "https://github.com/bolandeu/llmkit" }
html_to_gutenberg = { git = "https://github.com/bolandeu/html-to-gutenberg" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
