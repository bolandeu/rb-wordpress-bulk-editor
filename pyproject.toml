[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "rb-wordpress-bulk-editor"
# Версия — из git-тега vX.Y.Z (uv-dynamic-versioning); строку `version =` не добавлять.
dynamic = ["version"]
description = "WordPress Bulk Editor - Excel <-> WordPress sync"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "python-slugify>=8.0.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "rb-llmkit>=0.4,<0.5",
    "rb-html-to-gutenberg>=0.4,<0.5",
]

[project.scripts]
wp-bulk = "src.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/worppress-bulk-editor"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Импортный пакет исторически называется `src`. hatchling кладёт в wheel все
# файлы пакета, включая бандленный SKILL.md (его читают `wp-bulk --ai` и агент,
# у которого есть только установленный пакет) и py.typed.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Покрытие — часть гейта (release.py запускает голый `pytest`): fail_under ниже.
addopts = "--cov --cov-report=term-missing:skip-covered"
# Снапшоты справки лежат в tests/snapshots/help/<команда>.txt (стандарт §7), а не
# в раскладке syrupy `__snapshots__/<файл теста>/` — syrupy предупреждает, что
# «не может связать» файл с тестом. Может — по имени.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S — bandit-правила безопасности (обязательны протоколом cli-builder).
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — это и есть инструмент (S101).
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__main__.py", "src/cli/__main__.py"]

[tool.coverage.report]
# Нижняя граница по факту текущего прогона, а не по пожеланиям:
# ронять сборку она не должна, но и опускаться ниже нельзя.
fail_under = 64

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.uv]
# Пересобирать editable-установку при новом коммите/теге, чтобы --version шёл за тегом.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
rb-llmkit = { git = "https://github.com/bolandeu/llmkit", tag = "v0.4.0" }
rb-html-to-gutenberg = { git = "https://github.com/bolandeu/html-to-gutenberg", tag = "v0.4.0" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "syrupy>=4.8",
    "towncrier>=24.8",
    "ty>=0.0.80",
]

# Changelog из фрагментов: каждое изменение — файл changelog.d/+<slug>.<type>.md
# (`uv run towncrier create +<slug>.<type>.md -c "..."`); собирает scripts/release.py.
[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.cli-generator]
# Где scripts/check_command_docstrings.py (git pre-commit + хуки Claude Code)
# ищет команды: здесь они в src/cli/*_commands.py, а не в commands/*.py шаблона.
commands = ["src/cli/*_commands.py"]
