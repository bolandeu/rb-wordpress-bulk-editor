name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Синхронизировать окружение
        run: uv sync --frozen

      - name: Линтер (E/F/S)
        # Пока advisory: в legacy-коде остаётся накопленный долг по E501/F401.
        # Снять continue-on-error, когда долг разобран.
        continue-on-error: true
        run: uv run ruff check .

      - name: Тесты с покрытием (fail_under в pyproject.toml)
        run: uv run python -m pytest -q --cov=src --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner читает uv.lock напрямую — отдельный экспорт не нужен.
      - name: Аудит зависимостей (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=uv.lock
